<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Cartografía y Capas Geoespaciales — Cerebro Electoral (CE).">
  <title>Cartografía & Capas — Cerebro Electoral (CE)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Leaflet 1.9.4 CSS & JS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/mapa.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="cartografia">



  <!-- NAVEGACIÓN LATERAL -->
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main" id="main-content" style="padding-top: calc(var(--filter-bar-height) + var(--space-md));">
    <div class="mando-workspace animate-fade-in-up">

      <section class="mando-header">
        <div class="mando-header__title-box">
          <h1><i data-lucide="map" style="color:var(--accent-cyan);"></i> Cartografía Maestro y Visor Multicapa — Campeche</h1>
          <p>Exploración interactiva de capas vectoriales INEGI 2024, AGEBs urbanas/rurales, localidades y catálogo educativo SEP CCT.</p>
        </div>

        <div class="mando-header__pills" id="carto-pills"></div>
      </section>

      <!-- Coloreado municipal: los botones que antes se enganchaban
           desde JS a IDs que no existían en el HTML. -->
      <section class="carto-controles">
        <span class="text-label">Colorear municipios por</span>
        <div class="subnav-bar" role="group" aria-label="Variable de coloreado">
          <button class="subnav-btn subnav-btn--active" data-colorear="">
            <i data-lucide="circle-slash"></i><span>Sin coloreado</span>
          </button>
          <button class="subnav-btn" data-colorear="escuelas_por_municipio">
            <i data-lucide="school"></i><span>Escuelas CCT</span>
          </button>
          <button class="subnav-btn" data-colorear="alumnado">
            <i data-lucide="users-round"></i><span>Alumnado</span>
          </button>
          <button class="subnav-btn" data-colorear="ganador_2024">
            <i data-lucide="flag"></i><span>Ganador 2024</span>
          </button>
          <button class="subnav-btn" data-colorear="participacion_2024">
            <i data-lucide="user-check"></i><span>Participación 2024</span>
          </button>
          <button class="subnav-btn" data-colorear="margen_2024">
            <i data-lucide="git-compare"></i><span>Margen 2024</span>
          </button>
          <button class="subnav-btn" data-colorear="nulos_2024">
            <i data-lucide="file-x"></i><span>Voto nulo 2024</span>
          </button>
          <button class="subnav-btn" data-colorear="competitividad_2024">
            <i data-lucide="swords"></i><span>Competitividad</span>
          </button>
        </div>

        <span class="text-label">Población (Censo 2020)</span>
        <div class="subnav-bar" role="group" aria-label="Variable de población">
          <button class="subnav-btn" data-colorear="censo_poblacion_total">
            <i data-lucide="users"></i><span>Población total</span>
          </button>
          <button class="subnav-btn" data-colorear="censo_mujeres">
            <i data-lucide="user"></i><span>Mujeres</span>
          </button>
          <button class="subnav-btn" data-colorear="censo_hombres">
            <i data-lucide="user"></i><span>Hombres</span>
          </button>
          <button class="subnav-btn" data-colorear="censo_mayores_18">
            <i data-lucide="user-check"></i><span>Mayores de 18</span>
          </button>
          <button class="subnav-btn" data-colorear="censo_menores_18">
            <i data-lucide="baby"></i><span>Menores de 18</span>
          </button>
          <button class="subnav-btn" data-colorear="censo_mayores_50">
            <i data-lucide="user-round"></i><span>Mayores de 50</span>
          </button>
        </div>
        <span id="carto-proc"></span>
      </section>

      <!-- Visor de Mapa Principal -->
      <!-- flex:none a propósito: .mando-map-card trae flex:1, que en una
           columna sin altura propia colapsa la caja a su min-height y dejaba
           el mapa en 320 px por más que la altura dijera 650. -->
      <section class="mando-map-card" id="mapa-cartografia"
               style="flex:none; height: min(680px, 72vh);"></section>

      <section class="panel" id="resumen-estatal"></section>

      <!-- Inventario de Capas y Metadatos Cartográficos -->
      <section class="panel">
        <h3 class="text-h3 panel__titulo">
          <i data-lucide="layers" class="icon-sm"></i> Inventario de capas y procedencia
        </h3>
        <div class="rejilla-tarjetas" id="inventario-capas"></div>
        <div id="inventario-leyenda"></div>
      </section>

    </div>
  
      <!-- Consola de Agentes CE en Vivo -->
      <section class="glass-strong" style="padding:var(--space-md); border-radius:var(--radius-lg);">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="display:inline-block;width:7px;height:7px;background:var(--accent-cyan);border-radius:50%;box-shadow:0 0 6px var(--accent-cyan);" class="animate-pulse"></span>
          <strong style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-heading); font-family:var(--font-heading);">Agentes CE — Monitor en Vivo</strong>
          <i data-lucide="cpu" class="icon-xs" style="color:var(--accent-cyan); margin-left:auto;"></i>
        </div>
        <div id="live-agents-feed" style="font-size:0.72rem; font-family:monospace; display:flex; flex-direction:column; gap:5px;"></div>
      </section>

  </main>

  <script src="js/mapa.js"></script>
  <script src="js/electoral.js"></script>
  <script src="js/censo.js"></script>
  <script src="js/procedencia.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script>
  /* Inventario de capas: una sola tabla manda, y cada entrada declara su
     procedencia. Las capas del INEGI son DATO (vienen tal cual de la fuente);
     los coloreados son CÁLCULO (agregación sobre el catálogo CCT). */
  const CAPAS_INVENTARIO = [
    { titulo: 'Límite estatal', proc: 'dato',
      fuente: 'INEGI — Marco Geoestadístico 2024', corte: '2024-08',
      detalle: 'Polígono perimetral de Campeche (entidad 04), 8 polígonos con territorio insular.' },
    { titulo: '13 municipios', proc: 'dato',
      fuente: 'INEGI — Marco Geoestadístico 2024', corte: '2024-08',
      detalle: 'Delimitación completa, con Dzitbalché y Seybaplaya creados en 2021.' },
    { titulo: 'Localidades urbanas y rurales', proc: 'dato',
      fuente: 'INEGI — Marco Geoestadístico 2024', corte: '2024-08',
      detalle: '511 polígonos amanzanados: 33 urbanos y 478 rurales.' },
    { titulo: 'AGEB urbanas y rurales', proc: 'dato',
      fuente: 'INEGI — Marco Geoestadístico 2024', corte: '2024-08',
      detalle: '473 AGEB urbanas y 250 rurales.' },
    { titulo: 'Escuelas CCT', proc: 'dato',
      fuente: 'SEP — Catálogo de Centros de Trabajo', corte: null,
      detalle: '2,274 registros en 1,482 sitios físicos. Todos con estatus de ubicación potencial: ninguno está aprobado como casilla.' },
    { titulo: 'Casillas instaladas 2024', proc: 'dato',
      fuente: 'INE — Encarte del Proceso Electoral Federal 2023-2024', corte: '2024-06',
      detalle: '1,230 casillas en 585 sitios de 544 secciones. 415 sitios llevan coordenada; el resto no cruzó contra el catálogo CCT y se queda sin dibujar antes que inventarle un punto.' },
    { titulo: 'Resultados por sección 2024', proc: 'dato',
      fuente: 'IEEC — Cómputos distritales, diputaciones locales MR', corte: '2024-06',
      detalle: '542 secciones de los 21 distritos locales, con votación por partido y coalición, lista nominal, nulos y participación. Alimenta cuatro coloreados municipales.' },
    { titulo: 'Secciones y distritos electorales (polígonos)', proc: null, pendiente: true,
      fuente: 'Cartografía Electoral INE / IEEC', corte: null,
      detalle: 'Hay resultados por sección, pero no la geometría de la sección. Mientras no llegue, el resultado seccional se ve en el punto de su casilla y agregado a municipio, nunca como superficie pintada.' },
  ];

  function pintarInventario() {
    document.getElementById('inventario-capas').innerHTML = CAPAS_INVENTARIO.map((c) => `
      <article class="tarjeta">
        <header class="tarjeta__cabeza">
          <strong>${c.titulo}</strong>
          ${c.pendiente
            ? '<span class="badge badge--warn">Pendiente de insumo</span>'
            : Procedencia.badge(c.proc)}
        </header>
        <p class="tarjeta__texto">${c.detalle}</p>
        ${Procedencia.pie({ fuente: c.fuente, fechaCorte: c.corte })}
      </article>`).join('');

    // Las píldoras se cuentan del catálogo, no se escriben a mano: la última
    // vez que se escribieron a mano quedaron desfasadas tres fases seguidas.
    const todas = CerebroMapa.CATALOGO.flatMap((g) => g.capas);
    const disp = todas.filter((c) => c.estado === 'disponible').length;
    const pend = todas.length - disp;
    const pills = document.getElementById('carto-pills');
    if (pills) {
      pills.innerHTML =
        `<span class="badge badge--success" style="padding:6px 12px;">${disp} capas disponibles</span>` +
        `<span class="badge badge--neutral" style="padding:6px 12px;">${pend} pendientes de insumo</span>`;
    }

    document.getElementById('inventario-leyenda').innerHTML = Procedencia.leyenda();
    Procedencia.iconos();
  }

  /* Resumen del estado: quién ganó Campeche y quién ganó dónde.
     El agregado sale de Electoral.agregar(), la misma función que usa
     historico.html — aquí no se vuelve a calcular ganador ni margen. */
  function pintarResumen(elec) {
    const E = window.Electoral;
    const P = window.Procedencia;
    const municipios = Object.values(elec.municipios);
    const ag = E.agregar(municipios);
    const porGanador = E.municipiosPorGanador(municipios);
    const esc = (v) => String(v === null || v === undefined ? '\u2014' : v)
      .replace(/[&<>"]/g, (c) =>
        ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const c = (b) => `var(${E.color(b)})`;

    document.getElementById('resumen-estatal').innerHTML = `
      <h3 class="text-h3 panel__titulo">
        <i data-lucide="flag"></i> Quién ganó Campeche en 2024
        ${P.badge('dato', { fuente: elec.meta.fuente, fechaCorte: elec.meta.fecha_corte })}
      </h3>
      <p class="tarjeta__texto" style="max-width:78ch">
        Diputaciones locales de mayoría relativa, agregado de las
        ${E.num(ag.secciones)} secciones de los 13 municipios. Ganar el estado
        por votos y ganar más municipios son cosas distintas: abajo están las
        dos lecturas.
      </p>

      <div class="rejilla-tarjetas" style="margin-top:var(--space-md)">
        <div class="cifra">
          <span class="cifra__valor" style="color:${c(ag.ganador)}">${
            esc(E.etiqueta(ag.ganador))}</span>
          <span class="cifra__etiqueta">Fuerza más votada</span>
          <span class="cifra__pie">${P.badge('dato', { compacto: true })}</span>
        </div>
        <div class="cifra">
          <span class="cifra__valor">${ag.margen.toFixed(1)} pp</span>
          <span class="cifra__etiqueta">Margen sobre ${esc(E.etiqueta(ag.segundo))}</span>
          <span class="cifra__pie">${P.badge('calculo', {
            compacto: true, detalle: '1\u00b0 \u2212 2\u00b0 sobre v\u00e1lidos' })}</span>
        </div>
        <div class="cifra">
          <span class="cifra__valor">${E.pct(ag.participacion)}</span>
          <span class="cifra__etiqueta">Participación</span>
          <span class="cifra__pie">${P.badge('calculo', {
            compacto: true, detalle: 'total \u00f7 lista nominal' })}</span>
        </div>
        <div class="cifra">
          <span class="cifra__valor">${E.num(ag.validos)}</span>
          <span class="cifra__etiqueta">Votos válidos</span>
          <span class="cifra__pie">${P.badge('dato', { compacto: true })}</span>
        </div>
      </div>

      <div class="tabla-caja" style="margin-top:var(--space-md)">
        <table class="tabla">
          <thead>
            <tr>
              <th>Fuerza</th>
              <th class="num">Municipios</th>
              <th>Cuáles</th>
              <th class="num">% de válidos</th>
            </tr>
          </thead>
          <tbody>
            ${porGanador.map(([b, ms]) => `
              <tr>
                <td><span class="punto-color" style="background:${c(b)}"></span>
                    <strong>${esc(E.etiqueta(b))}</strong></td>
                <td class="num">${ms.length}</td>
                <td class="text-small">${ms.map((m) =>
                  `${esc(m.nombre)} <span style="opacity:.6">+${
                    m.margen.toFixed(0)}</span>`).join(' \u00b7 ')}</td>
                <td class="num">${E.pct(ag.bloques[b] / ag.validos * 100)}</td>
              </tr>`).join('')}
          </tbody>
        </table>
      </div>
      <p class="panel__nota">
        El margen de cada municipio va en puntos porcentuales sobre su segundo
        lugar. Haz clic en un municipio del mapa para ver su ficha completa con
        los ${ag.ordenPartidos.length} contendientes.
      </p>
      ${P.pie({
        fuente: elec.meta.fuente,
        fechaCorte: elec.meta.fecha_corte,
        metodologia: 'Agregación de los resultados municipales. El ganador se '
          + 'decide sobre el bloque de coalición, no sobre el partido suelto.',
        cobertura: elec.meta.cobertura,
        confianza: 'alta',
      })}`;
    P.iconos();
  }

  document.addEventListener('DOMContentLoaded', () => {
    pintarInventario();

    Promise.all([
      fetch('data/geo/escuelas_campeche.geojson').then((r) => r.json()),
      Electoral.cargar(),
      Censo.cargar(),
      // Sólo para el σ que fija el umbral de competitividad. Sin esto habría
      // que duplicar el 4.5 aquí, y una constante duplicada es una constante
      // que se desincroniza en cuanto llegue más tracking.
      Electoral.cargarEncuestas(),
    ])
      .then(([json, elec, censo, encuestas]) => {
        const escuelas = {};
        const alumnado = {};
        json.features.forEach((f) => {
          const k = f.properties.cve_mun;
          if (!k) return;
          escuelas[k] = (escuelas[k] || 0) + 1;
          alumnado[k] = (alumnado[k] || 0) + (f.properties.alumnos_total || 0);
        });

        /* El catálogo CCT NO declara fecha de corte: se pasa el nulo que
           trae el archivo en vez de inventar un "2024". La ficha del mapa
           imprime "no declarada por la fuente". */
        const comun = {
          fuente: json.metadata.fuente,
          fechaCorte: json.metadata.fecha_corte,
          procedencia: 'Cálculo sobre el catálogo CCT',
        };

        CerebroMapa.registrarVariable('escuelas_por_municipio', Object.assign({
          etiqueta: 'Escuelas CCT por municipio',
          valores: escuelas,
          formato: (v) => v.toLocaleString('es-MX') + ' escuelas',
        }, comun));

        CerebroMapa.registrarVariable('alumnado', Object.assign({
          etiqueta: 'Alumnado registrado',
          valores: alumnado,
          formato: (v) => v.toLocaleString('es-MX') + ' alumnos',
        }, comun));

        Electoral.registrarVariables(elec);

        /* La casilla de 2024 trae la clave del plantel donde se instaló, así
           que su ficha puede cerrar el circuito: qué escuela es, cuánta gente
           estudia ahí y cuántas aulas tiene. Es el cruce que vuelve útil el
           punto — un domicilio en texto no dice si el inmueble aguanta seis
           urnas; el número de aulas sí. */
        const porCct = {};
        json.features.forEach((f) => {
          const p = f.properties;
          if (!p.cct) return;
          if (!porCct[p.cct]) porCct[p.cct] = Object.assign({ turnos: 0 }, p);
          porCct[p.cct].turnos += 1;
        });

        const esc = (v) => (v === null || v === undefined || v === ''
          ? '—'
          : String(v).replace(/[&<>"]/g, (c) =>
              ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])));

        function filasEscuela(e) {
          const filas = [
            ['Nivel', e.nivel],
            ['Servicio', e.servicio],
            ['Sostenimiento', e.sostenimiento],
            ['Alumnado', (e.alumnos_total || 0).toLocaleString('es-MX')],
            ['Docentes', (e.docentes_total || 0).toLocaleString('es-MX')],
            ['Aulas en uso', `${e.aulas_en_uso} de ${e.aulas_existentes}`],
          ];
          return '<tr><th colspan="2" class="mapa-ficha__sub">El plantel (catálogo CCT)</th></tr>' +
            filas.map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`).join('');
        }

        // El σ medido viaja con los datos electorales: registrarVariables y
        // la ficha lo usan para clasificar competitividad.
        elec.sigma = encuestas.sigma_recomendada.recomendado_pp;
        Censo.registrarVariables(censo);

        const fichaSeccion = Electoral.fichaSeccion(elec);
        const fichaMunicipio = Electoral.fichaMunicipio(elec);
        const fichaCenso = Censo.ficha(censo);

        const mapa = CerebroMapa.crear('#mapa-cartografia', {
          capas: ['limite', 'municipios', 'localidades', 'casillas_2024'],
          panelCapas: true,
          // El punto de la casilla abre con el plantel y con el resultado de
          // su sección; el polígono, con lo suyo. Cada geometría responde por
          // lo que es.
          fichaExtra: (props, capaId) => {
            const escuela = props.cct ? porCct[props.cct] : null;
            return (escuela ? filasEscuela(escuela) : '')
              + fichaSeccion(props, capaId)
              + fichaMunicipio(props, capaId)
              + fichaCenso(props, capaId);
          },
        });

        pintarResumen(elec);

        /* Procedencia por variable, no una sola para todas. Antes el badge
           decía "Cálculo" para cualquier coloreado, y eso es falso para las
           que vienen tal cual de la fuente: la población total del Censo es
           DATO, mientras que "menores de 18" es una resta que hicimos
           nosotros. La distinción es justamente lo que el badge existe para
           comunicar. */
        const PROC_VARIABLE = {
          escuelas_por_municipio: { tipo: 'calculo', fuente: json.metadata.fuente,
            fechaCorte: json.metadata.fecha_corte, detalle: 'conteo del catálogo CCT por municipio' },
          alumnado: { tipo: 'calculo', fuente: json.metadata.fuente,
            fechaCorte: json.metadata.fecha_corte, detalle: 'suma del alumnado del catálogo CCT' },
        };
        ['ganador_2024', 'participacion_2024', 'margen_2024', 'nulos_2024',
         'lista_nominal_2024', 'competitividad_2024'].forEach((id) => {
          PROC_VARIABLE[id] = {
            tipo: id === 'ganador_2024' || id === 'lista_nominal_2024' ? 'dato' : 'calculo',
            fuente: elec.meta.fuente, fechaCorte: elec.meta.fecha_corte,
            detalle: 'agregación por municipio',
          };
        });
        // El Censo declara campo por campo si es dato o cálculo; se lee de ahí.
        Censo.CAMPOS.forEach((c) => {
          const tipo = censo.meta.procedencia_por_campo[c.k];
          PROC_VARIABLE['censo_' + c.k] = {
            tipo: tipo,
            fuente: censo.meta.fuente,
            fechaCorte: censo.meta.fecha_corte,
            detalle: tipo === 'dato'
              ? 'columna del ITER, sin transformar'
              : censo.meta.derivaciones[c.k],
          };
        });

        const proc = document.getElementById('carto-proc');
        document.querySelectorAll('[data-colorear]').forEach((btn) => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('[data-colorear]').forEach((b) =>
              b.classList.toggle('subnav-btn--active', b === btn));
            const id = btn.dataset.colorear;
            mapa.setChoropleth(id || null);
            const p = PROC_VARIABLE[id];
            proc.innerHTML = p
              ? Procedencia.badge(p.tipo, {
                  detalle: p.detalle, fuente: p.fuente, fechaCorte: p.fechaCorte,
                })
              : '';
            Procedencia.iconos();
          });
        });
      });

    lucide.createIcons();
  });
  </script>
</body>
</html>
