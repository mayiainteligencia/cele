<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Fuentes de Datos y Registro de Trazabilidad — Cerebro Electoral (CE).">
  <title>Fuentes & Trazabilidad — Cerebro Electoral (CE)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
</head>
<body data-page="fuentes">



  <!-- NAVEGACIÓN LATERAL -->
  <nav class="sidebar" id="sidebar" aria-label="Navegación principal"></nav>

  <!-- CONTENIDO PRINCIPAL -->
  <main class="main" id="main-content" style="padding-top: calc(var(--filter-bar-height) + var(--space-md));">
    <div class="mando-workspace animate-fade-in-up">

      <section class="mando-header">
        <div class="mando-header__title-box">
          <h1><i data-lucide="database" style="color:var(--accent-cyan);"></i> Registro Oficial de Fuentes & Trazabilidad de Datos</h1>
          <p>Auditoría completa de insumos geoespaciales, transformaciones cartográficas de proyección y fechas de corte.</p>
        </div>

        <div class="mando-header__pills" id="cabecera-pills"></div>
      </section>

      <div data-territorio id="contenido"></div>

  </main>

  <script src="js/procedencia.js"></script>
  <script src="js/territorio.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vistas/fuentes.js"></script>
  <script>
    const PENDIENTES = [
      ['Secciones electorales', 'Cartografía Electoral INE',
       'Polígonos de sección. El corte cambia con cada redistritación.'],
      ['Distritos federales', 'Cartografía Electoral INE',
       'Demarcación federal vigente para el proceso 2027.'],
      ['Distritos locales', 'IEEC Campeche / INE',
       'Probablemente los provea el instituto local; acceso en gestión.'],
      ['Casillas históricas', 'Encartes INE de procesos anteriores',
       'No es cartografía: son los encartes publicados por proceso.'],
      ['Casillas aprobadas 2027', 'Acuerdos del Consejo General del INE',
       'No existen todavía. Se publican después de aprobar el encarte.'],
    ];

    const SIMULADOS = [
      ['Población y lista nominal', 'Pendiente de INEGI (Censo) y de INE (padrón)'],
      ['Secciones y casillas por tipo', 'Pendiente de INE'],
      ['Nivel socioeconómico', 'Estimación propia sobre proxy de ruralidad'],
      ['Resultados históricos', 'Pendiente de INE / IEEC'],
      ['Proyección 2027', 'Modelo de demostración con intervalos'],
    ];

    document.addEventListener('DOMContentLoaded', () => {
      document.getElementById('fuentes-pendientes').innerHTML = PENDIENTES.map(([t, f, d]) => `
        <article class="tarjeta">
          <header class="tarjeta__cabeza">
            <strong>${t}</strong>
            <span class="badge badge--warn">Pendiente</span>
          </header>
          <p class="tarjeta__texto">${d}</p>
          ${Procedencia.pie({ fuente: f, fechaCorte: null })}
        </article>`).join('');

      document.getElementById('fuentes-simulado').innerHTML = SIMULADOS.map(([t, f]) => `
        <article class="tarjeta">
          <header class="tarjeta__cabeza">
            <strong>${t}</strong>
            ${Procedencia.badge('simulado')}
          </header>
          ${Procedencia.pie({ fuente: f, fechaCorte: null, confianza: 'baja' })}
        </article>`).join('');

      Procedencia.iconos();
      lucide.createIcons();
    });
  </script>
</body>
</html>
