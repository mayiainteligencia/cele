<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Vista aislada del componente de mapa de Cerebro Electoral, para probar capas, fichas y coloreado municipal.">
  <title>Mapa — Cerebro Electoral</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>

  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/mapa.css">

  <style>
    /* Página de prueba: solo encuadra el componente. */
    body { padding: var(--space-lg); min-height: 100vh; }
    .prueba__encabezado { margin-bottom: var(--space-md); }
    .prueba__mapa { height: min(72vh, 720px); }
    .prueba__acciones {
      display: flex; flex-wrap: wrap; gap: var(--space-xs);
      margin-top: var(--space-md);
    }
    .prueba__acciones button {
      padding: var(--space-2xs) var(--space-sm);
      border-radius: var(--radius-full);
      border: 1px solid var(--pill-border);
      background: var(--pill-bg);
      color: var(--text-body);
      font-size: 0.78rem;
    }
    .prueba__acciones button:hover { color: var(--text-heading); }
  </style>
</head>
<body>

  <header class="prueba__encabezado">
    <h1 class="text-h2">Componente de mapa</h1>
    <p class="text-small">
      Vista aislada para probar capas, fichas y coloreado municipal.
      Los valores de coloreado de esta página son de prueba, no del modelo.
    </p>
  </header>

  <div class="prueba__mapa" id="mapa"></div>

  <div class="prueba__acciones">
    <button data-var="">Sin coloreado</button>
    <button data-var="escuelas_por_municipio">Escuelas por municipio</button>
    <button data-var="alumnado">Alumnado registrado</button>
  </div>

  <script src="js/mapa.js"></script>
  <script>
    /* Variable de coloreado derivada de los propios puntos: es un CÁLCULO
       sobre el catálogo CCT, no una estimación ni un dato electoral. */
    fetch('data/geo/escuelas_campeche.geojson')
      .then((r) => r.json())
      .then((json) => {
        const escuelas = {};
        const alumnado = {};
        json.features.forEach((f) => {
          const k = f.properties.cve_mun;
          if (!k) return;
          escuelas[k] = (escuelas[k] || 0) + 1;
          alumnado[k] = (alumnado[k] || 0) + (f.properties.alumnos_total || 0);
        });

        CerebroMapa.registrarVariable('escuelas_por_municipio', {
          etiqueta: 'Registros CCT por municipio',
          valores: escuelas,
          formato: (v) => v.toLocaleString('es-MX'),
          fuente: json.metadata.fuente,
          fechaCorte: json.metadata.fecha_corte,
          procedencia: 'Cálculo sobre el catálogo CCT',
        });

        CerebroMapa.registrarVariable('alumnado', {
          etiqueta: 'Alumnado registrado',
          valores: alumnado,
          formato: (v) => v.toLocaleString('es-MX'),
          fuente: json.metadata.fuente,
          fechaCorte: json.metadata.fecha_corte,
          procedencia: 'Cálculo sobre el catálogo CCT',
        });

        const mapa = CerebroMapa.crear('#mapa', {
          capas: ['limite', 'escuelas'],
          panelCapas: true,
          // ?colorear=alumnado — para abrir directo en un coloreado.
          choropleth: new URLSearchParams(location.search).get('colorear') || null,
        });

        document.querySelectorAll('[data-var]').forEach((btn) => {
          btn.addEventListener('click', () => mapa.setChoropleth(btn.dataset.var || null));
        });

        window.__mapa = mapa; // gancho para la verificación automatizada
      });

    lucide.createIcons();
  </script>
</body>
</html>
