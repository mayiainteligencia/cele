<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Datos Históricos, Forensia Electoral y Alertas de Anomalías — Cerebro Electoral (CE).">
  <title>Forensia Electoral & Anomalías — Cerebro Electoral (CE)</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@200;300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Estilos -->
  <link rel="stylesheet" href="css/colors.css">
  <link rel="stylesheet" href="css/design-system.css">
  <link rel="stylesheet" href="css/animations.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">

  <style>
    .tabla-forensia {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.82rem;
    }
    .tabla-forensia th {
      background: var(--panel-fondo-alto);
      color: var(--text-heading);
      padding: 12px 14px;
      text-align: left;
      border-bottom: 1px solid var(--glass-border);
    }
    .tabla-forensia td {
      padding: 12px 14px;
      border-bottom: 1px solid var(--velo-05);
      color: var(--text-body);
    }
  </style>
</head>
<body data-page="forensia">



  <nav class="sidebar" id="sidebar" aria-label="Navegación principal"></nav>

  <main class="main" id="main-content" style="padding-top: calc(var(--filter-bar-height) + var(--space-md));">
    <div class="mando-workspace animate-fade-in-up">

      <section class="mando-header">
        <div class="mando-header__title-box">
          <h1><i data-lucide="shield-alert" style="color:var(--accent-cyan);"></i> Forensia Electoral y Detección de Anomalías</h1>
          <p>Distancia de cada sección respecto a la mediana de las secciones de su mismo tamaño. Una desviación estadística no es una acusación: el nivel rojo sólo lo enciende una resolución del Tribunal.</p>
        </div>

        <div class="mando-header__pills" id="cabecera-pills"></div>
      </section>

      <div data-territorio id="contenido"></div>

      <!-- Consola de Agentes CE en Vivo -->
      <section class="glass-strong" style="padding:var(--space-md); border-radius:var(--radius-lg);">
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px;">
          <span style="display:inline-block;width:7px;height:7px;background:var(--accent-cyan);border-radius:50%;box-shadow:0 0 6px var(--accent-cyan);" class="animate-pulse"></span>
          <strong style="font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-heading); font-family:var(--font-heading);">Agentes CE — Monitor en Vivo</strong>
          <i data-lucide="cpu" class="icon-xs" style="color:var(--accent-cyan); margin-left:auto;"></i>
        </div>
        <div id="live-agents-feed" style="font-size:0.72rem; font-family:monospace; display:flex; flex-direction:column; gap:5px;"></div>
      </section>

  </main>

  <script src="js/procedencia.js"></script>
  <script src="js/territorio.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/electoral.js"></script>
  <script src="js/app.js"></script>
  <script src="js/vistas/forensia.js"></script>
  <script>lucide.createIcons();</script>
</body>
</html>
